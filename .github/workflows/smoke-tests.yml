name: Smoke tests (Maestro, Android emulator)

on:
  workflow_dispatch:
    inputs:
      flows:
        description: 'Flow file or folder to run'
        default: '.maestro/release/'
        type: string
  push:
    branches:
      - qa/maestro-pilot

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MAESTRO_VERSION: 2.11.0
      MAESTRO_SHA256: 5384593cb4e7a106489e75a821d157dd43f4e438df6bc308b72e82c685e1283a
      MAESTRO_CLI_NO_ANALYTICS: 1
      APK: packages/smooth_app/build/app/outputs/flutter-apk/app-debug.apk
    steps:
      - uses: actions/checkout@v7

      # Same app sources give the same APK, so a flow-only change skips the build.
      - uses: actions/cache/restore@v6
        id: apk-cache
        with:
          path: ${{ env.APK }}
          key: smoke-apk-${{ hashFiles('packages/**', 'flutter-version.txt', 'ci/**', '.github/workflows/smoke-tests.yml') }}

      - uses: actions/setup-java@v6.1.0
        if: steps.apk-cache.outputs.cache-hit != 'true'
        with:
          distribution: 'zulu'
          java-version: 21

      - run: echo "FLUTTER_VERSION=$(cat flutter-version.txt)" >> $GITHUB_OUTPUT
        if: steps.apk-cache.outputs.cache-hit != 'true'
        id: flutter-version

      - uses: subosito/flutter-action@v2
        if: steps.apk-cache.outputs.cache-hit != 'true'
        with:
          cache: true
          flutter-version: ${{ steps.flutter-version.outputs.FLUTTER_VERSION }}
          cache-key: flutter-${{ hashFiles('flutter-version.txt')}}-${{ hashFiles('packages/smooth_app/pubspec.lock')}}

      - run: chmod +x ci/dependencies/scanner/enable_mlkit_dependency.sh && ci/dependencies/scanner/enable_mlkit_dependency.sh
        if: steps.apk-cache.outputs.cache-hit != 'true'

      - run: chmod +x ci/dependencies/app_store/enable_google_play_dependency.sh && ci/dependencies/app_store/enable_google_play_dependency.sh
        if: steps.apk-cache.outputs.cache-hit != 'true'

      - run: ci/pub_get.sh
        if: steps.apk-cache.outputs.cache-hit != 'true'

      - name: Build debug APK
        if: steps.apk-cache.outputs.cache-hit != 'true'
        working-directory: ./packages/smooth_app
        run: flutter build apk --debug --target-platform android-x64 -t lib/entrypoints/android/main_google_play.dart

      # Saved now rather than at job end, so a failing flow still keeps the APK.
      - uses: actions/cache/save@v6
        if: steps.apk-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ env.APK }}
          key: ${{ steps.apk-cache.outputs.cache-primary-key }}

      - name: Install Maestro
        run: |
          curl -fsSLo maestro.zip "https://github.com/mobile-dev-inc/Maestro/releases/download/cli-${MAESTRO_VERSION}/maestro.zip"
          echo "${MAESTRO_SHA256}  maestro.zip" | sha256sum -c -
          unzip -q maestro.zip -d "$HOME"
          echo "$HOME/maestro/bin" >> $GITHUB_PATH

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/cache/restore@v6
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: smoke-avd-v1-34-google_apis-x86_64

      - name: Create AVD snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "AVD snapshot created"

      # Saved before the flows run, so the cached image never holds the app.
      - uses: actions/cache/save@v6
        if: steps.avd-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: ${{ steps.avd-cache.outputs.cache-primary-key }}

      - name: Check the unknown product barcode is still unknown
        run: |
          curl -sS "https://world.openfoodfacts.org/api/v2/product/9990000000005?fields=code" | grep -q '"status":0' \
            || { echo "::error::9990000000005 now exists in the database (or the API is unreachable), pick another unknown barcode for add_unknown_product.yaml"; exit 1; }

      - name: Run smoke flows
        uses: reactivecircus/android-emulator-runner@v2.38.0
        env:
          FLOWS: ${{ inputs.flows || '.maestro/release/' }}
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb install "$APK"
            maestro test "$FLOWS" --format junit --output maestro-report.xml --debug-output maestro-debug

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: maestro-results
          include-hidden-files: true
          path: |
            maestro-report.xml
            maestro-debug/
