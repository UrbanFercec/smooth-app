name: Smoke tests (Maestro, Android emulator)

on:
  workflow_dispatch:
  push:
    branches:
      - qa/maestro-pilot

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MAESTRO_VERSION: 2.11.0
      MAESTRO_SHA256: 5384593cb4e7a106489e75a821d157dd43f4e438df6bc308b72e82c685e1283a
      MAESTRO_CLI_NO_ANALYTICS: 1
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6.1.0
        with:
          distribution: 'zulu'
          java-version: 21

      - run: echo "FLUTTER_VERSION=$(cat flutter-version.txt)" >> $GITHUB_OUTPUT
        id: flutter-version

      - uses: subosito/flutter-action@v2
        with:
          cache: true
          flutter-version: ${{ steps.flutter-version.outputs.FLUTTER_VERSION }}
          cache-key: flutter-${{ hashFiles('flutter-version.txt')}}-${{ hashFiles('packages/smooth_app/pubspec.lock')}}

      - run: chmod +x ci/dependencies/scanner/enable_mlkit_dependency.sh && ci/dependencies/scanner/enable_mlkit_dependency.sh

      - run: chmod +x ci/dependencies/app_store/enable_google_play_dependency.sh && ci/dependencies/app_store/enable_google_play_dependency.sh

      - run: ci/pub_get.sh

      - name: Build debug APK
        working-directory: ./packages/smooth_app
        run: flutter build apk --debug --target-platform android-x64 -t lib/entrypoints/android/main_google_play.dart

      - name: Install Maestro
        run: |
          curl -fsSLo maestro.zip "https://github.com/mobile-dev-inc/Maestro/releases/download/cli-${MAESTRO_VERSION}/maestro.zip"
          echo "${MAESTRO_SHA256}  maestro.zip" | sha256sum -c -
          unzip -q maestro.zip -d "$HOME"
          echo "$HOME/maestro/bin" >> $GITHUB_PATH

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run smoke flows
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install packages/smooth_app/build/app/outputs/flutter-apk/app-debug.apk
            maestro test .maestro/ --format junit --output maestro-report.xml --debug-output maestro-debug

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: maestro-results
          include-hidden-files: true
          path: |
            maestro-report.xml
            maestro-debug/
