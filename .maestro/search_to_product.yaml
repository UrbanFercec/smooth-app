appId: org.openfoodfacts.scanner
name: Search a barcode, open the product page
---
- runFlow: onboarding.yaml
- tapOn: "Search for a product"
- tapOn: "Search"
- inputText: "3017620422003"
- pressKey: Enter
- extendedWaitUntil:
    visible: "Nutella"
    timeout: 60000
- assertVisible: ".*Nutri-Score.*"
